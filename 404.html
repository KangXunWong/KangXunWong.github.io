<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | Kang Xun Wong</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Raleway, system-ui, sans-serif;
      background: #0a0e17;
      color: #e6f1ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container { text-align: center; padding: 2rem; }
    h1 { font-size: 6rem; color: #64ffda; margin-bottom: 0.5rem; }
    p { font-size: 1.2rem; color: #8892b0; margin-bottom: 2rem; }
    a {
      color: #64ffda;
      text-decoration: none;
      border: 1px solid #64ffda;
      padding: 0.75rem 2rem;
      border-radius: 4px;
      transition: background 0.2s;
    }
    a:hover { background: rgba(100, 255, 218, 0.1); }
    .countdown { color: #8892b0; font-size: 0.9rem; margin-top: 1rem; }
  </style>
  <script>
    setTimeout(function() {
      window.location.replace('/');
    }, 3000);
  </script>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Page not found. Redirecting you home...</p>
    <a href="/">Back to Home</a>
    <p class="countdown">Auto-redirect in 3 seconds</p>
  </div>
</body>
</html>
